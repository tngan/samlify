version: 2.1

jobs:
  test:
    parameters:
      node:
        type: string
    docker:
      - image: cimg/node:<< parameters.node >>
    steps:
      - checkout
      - run:
          name: Install Java JDK 21
          command: |
            sudo apt-get update
            sudo apt-get install -y wget lsb-release
            sudo mkdir -p /etc/apt/keyrings
            wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | sudo tee /etc/apt/keyrings/adoptium.asc
            echo "deb [signed-by=/etc/apt/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/adoptium.list
            sudo apt-get update
            sudo apt-get install -y temurin-21-jdk
            java -version
            javac -version
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Lint
          command: yarn lint
      - run:
          name: Run tests
          command: yarn test

workflows:
  test:
    jobs:
      - test:
          name: test-node-20
          node: '20.19'
      - test:
          name: test-node-22
          node: '22.23'
      - test:
          name: test-node-24
          node: '24.0'
